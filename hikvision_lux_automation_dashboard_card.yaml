# ============================================================================
# CAMERA_NAME - Lux Automation Dashboard Card
#
# Add via: Edit Dashboard -> Add Card -> Manual (paste this), or via the
# raw dashboard config editor. Adjust the "view" wrapper if you're pasting
# into an existing view rather than creating a new one.
# ============================================================================
type: vertical-stack
cards:
  - type: entities
    title: CAMERA_NAME - Tunable Variables
    entities:
      - entity: input_text.CAMERA_NAME_SLUG_lux_sensor_entity_id
        name: Lux Sensor Entity
      - type: divider
      - entity: input_number.CAMERA_ENTITY_ID_PREFIX_lux_floor
        name: Lux Floor (near-night)
      - entity: input_number.CAMERA_ENTITY_ID_PREFIX_lux_ceiling
        name: Lux Ceiling (peak brightness)
      - type: divider
      - entity: input_number.CAMERA_ENTITY_ID_PREFIX_gain_max
        name: Gain Max (near-night)
      - entity: input_number.CAMERA_ENTITY_ID_PREFIX_gain_min
        name: Gain Min (peak brightness)
      - type: divider
      - entity: input_number.CAMERA_ENTITY_ID_PREFIX_shutter_idx_min
        name: Shutter Index Min
      - entity: input_number.CAMERA_ENTITY_ID_PREFIX_shutter_idx_max
        name: Shutter Index Max
      - type: divider
      - entity: input_number.CAMERA_ENTITY_ID_PREFIX_lux_night_to_day
        name: Threshold - Night to Day
      - entity: input_number.CAMERA_ENTITY_ID_PREFIX_lux_day_to_night
        name: Threshold - Day to Night

  - type: gauge
    entity: sensor.CAMERA_NAME_SLUG_exposure_frac
    name: Exposure Fraction
    min: 0
    max: 1
    severity:
      green: 0
      yellow: 0.4
      red: 0.8

  - type: entities
    title: CAMERA_NAME - Live Status
    entities:
      - entity: sensor.CAMERA_SENSOR_ILLUMINANCE
        name: Current Lux
      - entity: sensor.CAMERA_NAME_SLUG_target_gain
        name: Target Gain (computed)
      - entity: sensor.CAMERA_NAME_SLUG_target_shutter
        name: Target Shutter (computed)
      - entity: select.CAMERA_ENTITY_ID_PREFIX_day_night_mode
        name: Day/Night Mode
      - entity: number.CAMERA_ENTITY_ID_PREFIX_gain
        name: Actual Camera Gain
      - entity: select.CAMERA_ENTITY_ID_PREFIX_shutter_speed
        name: Actual Camera Shutter
      - entity: select.CAMERA_ENTITY_ID_PREFIX_blc_mode
        name: BLC Mode
      - entity: switch.CAMERA_ENTITY_ID_PREFIX_hlc
        name: HLC
